name: Caribbean hierarchy and official source contracts

on:
  push:
    paths:
      - 'address-points/*CARIBBEAN*'
      - 'address-points/adapters/caribbean*.py'
      - 'releases/hierarchy/caribbean/**'
      - 'releases/hierarchy/catalog.json'
      - 'scripts/caribbean_official.py'
      - 'scripts/caribbean_osm.py'
      - 'requirements-caribbean-osm.txt'
      - 'scripts/hierarchy_*.py'
      - 'hierarchy-tests/test_hierarchy_caribbean.py'
      - 'tests/test_caribbean_official_sources.py'
      - 'tests/test_caribbean_open_map.py'
      - '.github/workflows/caribbean-source-quality.yml'
  pull_request:
    paths:
      - 'address-points/*CARIBBEAN*'
      - 'address-points/adapters/caribbean*.py'
      - 'releases/hierarchy/caribbean/**'
      - 'releases/hierarchy/catalog.json'
      - 'scripts/caribbean_official.py'
      - 'scripts/caribbean_osm.py'
      - 'requirements-caribbean-osm.txt'
      - 'scripts/hierarchy_*.py'
      - 'hierarchy-tests/test_hierarchy_caribbean.py'
      - 'tests/test_caribbean_official_sources.py'
      - 'tests/test_caribbean_open_map.py'
      - '.github/workflows/caribbean-source-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Check hierarchy, corrupted sources, scope, and metadata
        run: |
          python3 -m unittest discover -s hierarchy-tests -p 'test_hierarchy_caribbean.py' -v
          python3 -m unittest discover -s tests -p 'test_caribbean_official_sources.py' -v
          python3 -m unittest discover -s tests -p 'test_hierarchy_snapshot.py' -v
          python3 scripts/caribbean_official.py inventory
          python3 scripts/hierarchy_cli.py --region caribbean -- --help
          python3 -m localities layout
  open-map-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install optional open map parser dependencies
        run: python3 -m pip install -r requirements-caribbean-osm.txt
      - name: Verify all-scope extraction and explicit-number contracts
        run: python3 -m unittest discover -s tests -p 'test_caribbean_open_map.py' -v
