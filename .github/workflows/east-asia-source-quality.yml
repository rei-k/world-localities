name: East Asia source and coverage checks

on:
  push:
    paths:
      - 'scripts/east_asia_*.py'
      - 'scripts/tw_nlsc_reference.py'
      - 'scripts/osm_evidence.py'
      - 'scripts/osm_pbf_lite.py'
      - 'address-points/adapters/eastasia.py'
      - 'address-points/EAST_ASIA_SCOPE.json'
      - 'releases/hierarchy/east-asia/**'
      - 'tests/test_east_asia_sources.py'
      - 'tests/test_east_asia_release.py'
      - '.github/workflows/east-asia-source-quality.yml'
  pull_request:
    paths:
      - 'scripts/east_asia_*.py'
      - 'scripts/tw_nlsc_reference.py'
      - 'scripts/osm_evidence.py'
      - 'scripts/osm_pbf_lite.py'
      - 'address-points/adapters/eastasia.py'
      - 'address-points/EAST_ASIA_SCOPE.json'
      - 'releases/hierarchy/east-asia/**'
      - 'tests/test_east_asia_sources.py'
      - 'tests/test_east_asia_release.py'
      - '.github/workflows/east-asia-source-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned native parser
        run: python -m pip install -r scripts/requirements-osm.txt
      - name: Verify source fixtures and honest coverage boundaries
        run: |
          python -m unittest discover -s tests -p 'test_east_asia_sources.py' -v
          python -m unittest discover -s tests -p 'test_east_asia_release.py' -v
          python scripts/hierarchy_cli.py --region east-asia -- inventory > /dev/null
          python scripts/hierarchy_cli.py --region east-asia -- --help
          python scripts/east_asia_projection.py --help
          python scripts/east_asia_fast.py --help
          python scripts/tw_nlsc_reference.py --help
          python -m localities layout
