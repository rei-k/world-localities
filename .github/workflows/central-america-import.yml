name: Costa Rica source import

on:
  push:
    branches: ['data/central-america-costa-rica-20261015']
    paths:
      - 'central-america-registry/supplement.py'
      - '.github/workflows/central-america-import.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: costa-rica-source-import
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/data/central-america-costa-rica-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Acquire bounded source archives and verify every retained row
        shell: bash
        run: |
          mkdir -p /tmp/central-import-evidence
          python central-america-registry/supplement.py import | tee /tmp/central-import-evidence/import.json
          python central-america-registry/supplement.py verify | tee /tmp/central-import-evidence/verify.json
          python -m unittest discover -s tests -p 'test_americas_*.py' -v 2>&1 | tee /tmp/central-import-evidence/tests.log
      - name: Commit only validated additive country data to the same branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = 'data/central-america-costa-rica-20261015'
          remote_head=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          test "$remote_head" = "$EXPECTED_HEAD"
          git add -f central-america-registry/enrichment
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --name-only | python -c 'import sys; paths=sys.stdin.read().splitlines(); assert paths and all(p.startswith("central-america-registry/enrichment/") for p in paths)'
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'data: add pinned Costa Rica locality and multilingual source supplement'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Preserve source verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: costa-rica-source-evidence-${{ github.run_id }}
          path: /tmp/central-import-evidence/
          retention-days: 14
          if-no-files-found: warn
