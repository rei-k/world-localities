name: Costa Rica source import

on:
  push:
    branches: ['data/central-america-costa-rica-20261015']
    paths:
      - 'central-america-registry/supplement.py'
      - 'central-america-registry/government_codes.py'
      - 'scripts/central_enrichment_apply.py'
      - '.github/workflows/central-america-import.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: costa-rica-source-import
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/data/central-america-costa-rica-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify preserved CR data and acquire government canton code source
        shell: bash
        run: |
          mkdir -p /tmp/central-import-evidence
          python central-america-registry/supplement.py verify | tee /tmp/central-import-evidence/verify.json
          python central-america-registry/government_codes.py import | tee /tmp/central-import-evidence/government.json
          python scripts/central_enrichment_apply.py
      - name: Run all regression tests and eight-country payload checks
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_americas_*.py' -v 2>&1 | tee /tmp/central-import-evidence/tests.log
          python central-america-registry/quality.py | tee /tmp/central-import-evidence/eight-countries.json
          python central-america-registry/query_enriched.py --country CR --text 'San Jose' --language es > /tmp/central-import-evidence/query.json
          python central-america-registry/query_enriched.py --country CR --layer government-cantons --text 'Puerto Jimenez' > /tmp/central-import-evidence/canton-query.json
          python americas-registry/quality_cycle.py --rounds 2 --state-file /tmp/central-import-evidence/state.json > /tmp/central-import-evidence/cycle.json
      - name: Commit only validated country data and exact integration changes
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = 'data/central-america-costa-rica-20261015'
          remote_head=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          test "$remote_head" = "$EXPECTED_HEAD"
          git add -f central-america-registry/government-reference/CR
          git add README.md central-america-registry/README.md americas-registry/README.md americas-registry/audit.py americas-registry/quality_cycle.py tests/test_americas_unified.py tests/test_americas_integrity.py
          git rm scripts/central_enrichment_apply.py
          git diff --cached --name-only | python -c 'import sys; allowed={"README.md","central-america-registry/README.md","americas-registry/README.md","americas-registry/audit.py","americas-registry/quality_cycle.py","tests/test_americas_unified.py","tests/test_americas_integrity.py","scripts/central_enrichment_apply.py"}; paths=sys.stdin.read().splitlines(); assert paths and all(p in allowed or p.startswith("central-america-registry/government-reference/CR/") for p in paths)'
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'data: verify Costa Rica government codes and integrate eight-country Central America QA'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
      - name: Preserve source verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: costa-rica-source-evidence-${{ github.run_id }}
          path: /tmp/central-import-evidence/
          retention-days: 14
          if-no-files-found: warn
