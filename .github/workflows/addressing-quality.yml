name: Worldwide address compatibility checks

on:
  push:
    paths:
      - 'addressing/**'
      - 'scripts/compile_address_profiles.py'
      - 'tests/test_addressing_core.py'
      - 'tests/test_east_asia_addressing.py'
      - 'tests/test_southeast_asia_addressing.py'
      - 'tests/test_south_asia_addressing.py'
      - 'tests/test_central_asia_addressing.py'
      - 'tests/test_western_asia_addressing.py'
      - 'tests/test_repository_layout.py'
      - 'localities/registry_catalog.json'
      - '.github/workflows/addressing-quality.yml'
  pull_request:
    paths:
      - 'addressing/**'
      - 'scripts/compile_address_profiles.py'
      - 'tests/test_addressing_core.py'
      - 'tests/test_east_asia_addressing.py'
      - 'tests/test_southeast_asia_addressing.py'
      - 'tests/test_south_asia_addressing.py'
      - 'tests/test_central_asia_addressing.py'
      - 'tests/test_western_asia_addressing.py'
      - 'tests/test_repository_layout.py'
      - 'localities/registry_catalog.json'
      - '.github/workflows/addressing-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: addressing-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-addressing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify compiled profiles and contracts
        run: |
          python -m addressing verify
          python -m addressing east-asia
          python -m addressing southeast-asia
          python -m addressing south-asia
          python -m addressing central-asia
          python -m addressing western-asia
          python -m unittest discover -s tests -p 'test_addressing_core.py' -v
          python -m unittest discover -s tests -p 'test_east_asia_addressing.py' -v
          python -m unittest discover -s tests -p 'test_southeast_asia_addressing.py' -v
          python -m unittest discover -s tests -p 'test_south_asia_addressing.py' -v
          python -m unittest discover -s tests -p 'test_central_asia_addressing.py' -v
          python -m unittest discover -s tests -p 'test_western_asia_addressing.py' -v
          python -m unittest discover -s tests -p 'test_repository_layout.py' -v
          python -m localities layout
