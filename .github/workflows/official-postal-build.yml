name: Build pinned JP and TW official postal data
on:
  push:
    branches: [data/official-postal-jp-tw-20261001]
    paths:
      - official-registry/*.py
      - tests/test_official_postal.py
      - .github/workflows/official-postal-build.yml
permissions:
  contents: write
concurrency:
  group: official-postal-jp-tw-import
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: data/official-postal-jp-tw-20261001
      - name: Fetch hash-pinned public inputs and rebuild
        run: |
          python3 official-registry/sync.py
          python3 asia-registry/package.py unpack --country JP
          python3 official-registry/build.py build --country JP --geonames-jp asia-registry/countries/JP/entities.csv.gz
          python3 official-registry/build.py build --country TW
      - name: Validate source replay and join integrity
        run: |
          python3 official-registry/build.py verify --country JP
          python3 official-registry/build.py verify --country TW
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Save verified generated data to the import branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add official-registry/JP official-registry/TW
          if ! git diff --cached --quiet; then
            git commit -m 'Build and verify pinned official JP and TW postal datasets'
            git push origin HEAD:data/official-postal-jp-tw-20261001
          fi
