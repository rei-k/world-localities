name: Source-qualified hierarchy checks

on:
  push:
    paths:
      - 'address-points/**'
      - 'scripts/hierarchy_*.py'
      - 'scripts/*osm_evidence.py'
      - 'scripts/mx_address_evidence.py'
      - 'scripts/osm_stream.py'
      - 'scripts/restore_data_parts.py'
      - 'scripts/requirements-osm.txt'
      - 'tests/test_osm_evidence.py'
      - 'tests/test_mx_address_evidence.py'
      - 'tests/test_osm_stream.py'
      - 'tests/test_restore_data_parts.py'
      - 'hierarchy-tests/**'
      - 'tests/test_hierarchy_snapshot.py'
      - 'tests/test_repository_layout.py'
      - 'releases/hierarchy/**'
      - '.github/workflows/hierarchy-quality.yml'
  pull_request:
    paths:
      - 'address-points/**'
      - 'scripts/hierarchy_*.py'
      - 'scripts/*osm_evidence.py'
      - 'scripts/mx_address_evidence.py'
      - 'scripts/osm_stream.py'
      - 'scripts/restore_data_parts.py'
      - 'scripts/requirements-osm.txt'
      - 'tests/test_osm_evidence.py'
      - 'tests/test_mx_address_evidence.py'
      - 'tests/test_osm_stream.py'
      - 'tests/test_restore_data_parts.py'
      - 'hierarchy-tests/**'
      - 'tests/test_hierarchy_snapshot.py'
      - 'tests/test_repository_layout.py'
      - 'releases/hierarchy/**'
      - '.github/workflows/hierarchy-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Check hierarchy contracts without external source downloads
        run: |
          python -m unittest discover -s hierarchy-tests -p 'test_*.py' -v
          python -m unittest discover -s tests -p 'test_hierarchy_snapshot.py' -v
          python -m unittest discover -s tests -p 'test_repository_layout.py' -v
          python -m localities layout
          python scripts/hierarchy_cli.py --region south-america -- --help
          python scripts/hierarchy_cli.py --region north-america -- --help
          python scripts/hierarchy_cli.py --region central-america -- --help
  open-geodata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python setup
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned OSM parser
        run: python -m pip install -r scripts/requirements-osm.txt
      - name: Verify open geodata semantics with local source fixtures
        run: |
          python -m unittest discover -s tests -p 'test_osm_evidence.py' -v
          python -m unittest discover -s tests -p 'test_mx_address_evidence.py' -v
          python -m unittest discover -s tests -p 'test_osm_stream.py' -v
          python -m unittest discover -s tests -p 'test_restore_data_parts.py' -v
          python scripts/fetch_osm_evidence.py --help
          python scripts/osm_evidence.py --help
          python scripts/verify_osm_evidence.py --help
          python scripts/mx_address_evidence.py --help
          python scripts/osm_stream.py --help
          python scripts/restore_data_parts.py --help
